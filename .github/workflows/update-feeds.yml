name: Update podcast feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - podcasts.json
      - podcasts-additions.json
      - scripts/update-feeds.mjs
      - scripts/generate-seo.mjs
      - .github/workflows/update-feeds.yml
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-makmak.mjs
      - name: Commit recovered Mak Mak archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows/mak-mak-radio.json
          git diff --cached --quiet || git commit -m "Recover playable Mak Mak Radio archive"
          git pull --rebase origin main
          git push
