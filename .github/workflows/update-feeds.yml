name: Update podcast feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - podcasts.json
      - podcasts-additions.json
      - scripts/update-feeds.mjs
      - scripts/generate-seo.mjs
      - .github/workflows/update-feeds.yml
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-makmak.mjs # pagination
