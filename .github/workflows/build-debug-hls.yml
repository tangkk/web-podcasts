name: Build debug HLS segments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-debug-hls.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate three 30-second MP3 segments
        run: |
          mkdir -p debug-hls
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=30' -c:a libmp3lame -b:a 64k debug-hls/mp3-seg1.mp3
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=660:sample_rate=44100:duration=30' -c:a libmp3lame -b:a 64k debug-hls/mp3-seg2.mp3
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=880:sample_rate=44100:duration=30' -c:a libmp3lame -b:a 64k debug-hls/mp3-seg3.mp3
          cat > debug-hls/mock.m3u8 <<'EOF'
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-TARGETDURATION:31
          #EXT-X-MEDIA-SEQUENCE:0
          #EXT-X-PLAYLIST-TYPE:VOD
          #EXTINF:30.041,Mock 1 - 440 Hz
          mp3-seg1.mp3
          #EXTINF:30.041,Mock 2 - 660 Hz
          mp3-seg2.mp3
          #EXTINF:30.041,Mock 3 - 880 Hz
          mp3-seg3.mp3
          #EXT-X-ENDLIST
          EOF
      - name: Commit generated HLS assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-hls/mp3-seg1.mp3 debug-hls/mp3-seg2.mp3 debug-hls/mp3-seg3.mp3 debug-hls/mock.m3u8
          git diff --cached --quiet || git commit -m 'Generate 30-second MP3 HLS debug assets'
          git pull --rebase origin main
          git push
